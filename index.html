<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loi de Hooke : expérience du ressort vertical</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fbfcfd;--fg:#14212b;--mut:#5b6b78;--line:#cdd7de;--str:#0b7a75;--cmp:#c2410c;--acc:#1d4ed8;--blk:#2c3e4d;--drop:#1d4ed8;--s0:#0b7a75;--s1:#7c3aed;--s2:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--panel:#162129;--fg:#e6edf1;--mut:#92a4b1;--line:#2b3b46;--str:#3dd1c8;--cmp:#fb923c;--acc:#7aa2ff;--blk:#5a7488;--drop:#7aa2ff;--s0:#3dd1c8;--s1:#a78bfa;--s2:#fb923c}}
:root[data-theme="dark"]{--bg:#0f171d;--panel:#162129;--fg:#e6edf1;--mut:#92a4b1;--line:#2b3b46;--str:#3dd1c8;--cmp:#fb923c;--acc:#7aa2ff;--blk:#5a7488;--drop:#7aa2ff;--s0:#3dd1c8;--s1:#a78bfa;--s2:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Fira Sans",system-ui,sans-serif;padding:16px}
h1{font-size:1.35rem;margin:0 auto 12px;font-weight:600;max-width:460px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;max-width:460px;margin:auto}
canvas{display:block;width:100%;max-width:100%;touch-action:none;cursor:grab;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent;color:var(--fg);padding:8px 6px}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<h1>Loi de Hooke : ressort vertical</h1>
<div class="card">
  <div class="seg" role="group" aria-label="Position de la masse">
    <button id="mDown" aria-pressed="true">Masse en bas (étiré)</button>
    <button id="mUp" aria-pressed="false">Masse en haut (comprimé)</button>
  </div>
  <canvas id="exp" width="420" height="620" aria-label="Ressorts, règle graduée et masses à déplacer"></canvas>
  <div class="row"><button id="clear">Tout retirer</button></div>
</div>

<script>
(function(){
var G=9.81,S=1000,W=420,H=620,CX=200,PW=70,GAP=16,RY=346,RX=[290,340,390];
var st={k:0,l0:0,down:true,mass:0,x:0,v:0,springs:[],cur:0,n:14,lw:2.5};
var masses=[1,2,3,4,5].map(function(){return {g:100,h:30,att:false,drag:false,x:370,y:0}});
var stack=[],drag=null,sd=null,endY=0,Y0=40,YE=40;
function rnd(a,b){return a+Math.random()*(b-a)}
function $(i){return document.getElementById(i)}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function target(){var d=st.mass*G/st.k;return st.l0+(st.down?d:-d)}
function release(){stack.forEach(function(m){m.att=false});stack=[]}
function pick(i){var s=st.springs[i];st.cur=i;st.k=s.k;st.l0=s.l0;st.n=s.n;st.x=s.l0;st.v=0}
function newSpring(){
 // Paramètres fixes : mêmes valeurs à chaque lancement
 st.springs=[
  {k:50,l0:0.16,n:24},
  {k:40,l0:0.20,n:12},
  {k:80,l0:0.26,n:6}
 ];
 release();pick(st.cur<0?0:st.cur)}
function setup(c){var r=window.devicePixelRatio||1,w=c.clientWidth||W;
 c.style.height=(H*w/W)+'px';c.width=Math.round(w*r);c.height=Math.round(H*w/W*r);var x=c.getContext('2d');x.setTransform(r*w/W,0,0,r*w/W,0,0);return x}
function layout(yE){
 var acc=0,d=st.down;
 stack.forEach(function(m){m.x=CX;m.y=d?yE+acc+GAP:yE-acc-GAP-m.h;acc+=m.h+GAP});
 endY=d?yE+acc:yE-acc;
 var f=0;masses.forEach(function(m){if(!m.att&&!m.drag){m.x=370;m.y=90+(f++)*52}});
 if(drag){var a2=0;drag.forEach(function(m){m.x=drag.px;m.y=st.down?drag.py-m.h/2+a2:drag.py-m.h/2-a2;a2+=m.h+GAP})}}
function nearEnd(p){return st.cur>=0&&Math.abs(p.x-CX)<PW&&Math.abs(p.y-endY)<120}
function nearMount(p){return Math.abs(p.x-CX)<60&&Math.abs(p.y-Y0)<60}
function coil(x,cx,y0,dir,L,n,col){
 x.strokeStyle=col;x.lineWidth=2.5;x.lineJoin='round';var a=17,pad=12;
 x.beginPath();x.moveTo(cx,y0);x.lineTo(cx,y0+dir*pad);
 for(var j=1;j<=n*2;j++){var t=j/(n*2);x.lineTo(cx+(j%2?a:-a),y0+dir*(pad+(L-2*pad)*t))}
 x.lineTo(cx,y0+dir*(L-pad));x.lineTo(cx,y0+dir*L);x.stroke()}
function draw(){
 var c=$('exp'),x=setup(c),fg=css('--fg'),mut=css('--mut'),dir=st.down?1:-1,y0=st.down?40:580;
 Y0=y0;var L=st.cur>=0?st.x*S:0,yE=y0+dir*L;YE=yE;
 x.clearRect(0,0,W,H);layout(yE);
 x.strokeStyle=fg;x.lineWidth=2;x.beginPath();x.moveTo(CX-60,y0);x.lineTo(CX+60,y0);x.stroke();
 x.lineWidth=1;x.strokeStyle=mut;
 for(var i=-60;i<60;i+=10){x.beginPath();x.moveTo(CX+i,y0);x.lineTo(CX+i+8,y0-dir*9);x.stroke()}
 var rx=50;x.strokeStyle=fg;x.fillStyle=mut;x.font='11px "Fira Code",monospace';x.textAlign='right';
 x.beginPath();x.moveTo(rx,y0);x.lineTo(rx,y0+dir*420);x.stroke();
 for(var mm=0;mm<=420;mm+=5){var yy=y0+dir*mm,big=mm%50===0,mid=mm%10===0;
  x.beginPath();x.moveTo(rx,yy);x.lineTo(rx+(big?14:mid?9:5),yy);x.stroke();
  if(big)x.fillText(mm/10,rx-6,yy+4)}
 x.textAlign='left';x.fillText('cm',rx-26,y0-dir*8);
 var col=css('--s'+Math.max(st.cur,0));
 // ressort monté
 if(st.cur>=0){coil(x,CX,y0,dir,L,st.n,col);x.beginPath();x.arc(CX,yE+dir*6,3,0,7);x.stroke();
  x.fillStyle=mut;x.font='500 12px "Fira Sans",sans-serif';x.textAlign='left';x.fillText('Ressort '+(st.cur+1),CX+28,y0+dir*16+4);
  x.setLineDash([4,3]);x.strokeStyle=mut;x.lineWidth=1;x.beginPath();x.moveTo(rx,yE);x.lineTo(CX-20,yE);x.stroke();x.setLineDash([]);
  x.fillStyle=col;x.beginPath();x.arc(rx,yE,3.5,0,7);x.fill()}
 // râtelier à ressorts
 x.strokeStyle=mut;x.lineWidth=2;x.beginPath();x.moveTo(268,RY);x.lineTo(412,RY);x.stroke();
 st.springs.forEach(function(s,i){
  x.fillStyle=mut;x.font='500 12px "Fira Sans",sans-serif';x.textAlign='center';x.fillText(i+1,RX[i],RY-8);
  if(st.cur!==i&&!(sd&&sd.i===i))coil(x,RX[i],RY,1,s.l0*S,s.n,css('--s'+i))});
 // zones de dépôt
 var dz=css('--drop');
 if(drag&&nearEnd({x:drag.px,y:drag.py})){var th=drag.reduce(function(s,m){return s+m.h+GAP},0),dy=st.down?endY:endY-th;x.setLineDash([5,4]);x.strokeStyle=dz;x.lineWidth=1.5;x.strokeRect(CX-PW/2,dy,PW,th);x.setLineDash([])}
 if(sd&&nearMount({x:sd.px,y:sd.py})){x.setLineDash([5,4]);x.strokeStyle=dz;x.lineWidth=1.5;x.beginPath();x.arc(CX,y0,16,0,7);x.stroke();x.setLineDash([])}
 // masses
 masses.slice().sort(function(a,b){return a.drag-b.drag}).forEach(function(m){
  x.fillStyle=css('--blk');x.strokeStyle=css('--panel');x.lineWidth=1;
  x.fillRect(m.x-PW/2,m.y,PW,m.h);x.strokeRect(m.x-PW/2,m.y,PW,m.h);
  var ds=st.down?-1:1,yH=ds<0?m.y:m.y+m.h,yR=ds<0?m.y+m.h:m.y;x.strokeStyle=fg;x.lineWidth=2;x.beginPath();x.moveTo(m.x,yH);x.lineTo(m.x,yH+ds*9);x.arc(m.x+3,yH+ds*9,3,Math.PI,0,ds>0);x.moveTo(m.x+3,yR-ds*6);x.arc(m.x,yR-ds*6,3,0,7);x.stroke();
  x.fillStyle='#f2f6f8';x.font='500 12px "Fira Sans",sans-serif';x.textAlign='center';x.fillText('100 g',m.x,m.y+m.h/2+4)});
 // ressort tenu à la main
 if(sd)coil(x,sd.px,sd.py,dir,st.springs[sd.i].l0*S,st.springs[sd.i].n,css('--s'+sd.i))}
function tick(){
 if(st.cur>=0){st.mass=stack.reduce(function(s,m){return s+m.g},0)/1000;
  var w=14,z=0.28,dt=1/60,T=target(),a=-w*w*(st.x-T)-2*z*w*st.v;st.v+=a*dt;st.x+=st.v*dt;
  if(Math.abs(st.v)<0.002&&Math.abs(st.x-T)<0.0004){st.x=T;st.v=0}}
 $('mDown').setAttribute('aria-pressed',st.down);$('mUp').setAttribute('aria-pressed',!st.down);
 draw();requestAnimationFrame(tick)}
function pt(e){var r=$('exp').getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
var cv=$('exp');
cv.addEventListener('pointerdown',function(e){
 var p=pt(e),i;
 for(i=masses.length-1;i>=0;i--){var m=masses[i];
  if(Math.abs(p.x-m.x)<=PW/2&&p.y>=m.y-8&&p.y<=m.y+m.h+8){
   var g=m.att?stack.splice(stack.indexOf(m)):[m];g.forEach(function(q){q.att=false;q.drag=true});g.px=p.x;g.py=p.y;drag=g;
   cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';return}}
 if(st.cur>=0&&Math.abs(p.x-CX)<=24&&p.y>=Math.min(Y0,YE)&&p.y<=Math.max(Y0,YE)){
  sd={i:st.cur,px:p.x,py:p.y};release();st.cur=-1;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';return}
 for(i=0;i<st.springs.length;i++){
  if(i!==st.cur&&Math.abs(p.x-RX[i])<=24&&p.y>=RY&&p.y<=RY+st.springs[i].l0*S){
   sd={i:i,px:p.x,py:p.y};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';return}}});
cv.addEventListener('pointermove',function(e){var p=pt(e);if(drag){drag.px=p.x;drag.py=p.y}if(sd){sd.px=p.x;sd.py=p.y}});
function up(e){
 var p=pt(e);cv.style.cursor='grab';
 if(drag){var g=drag;g.forEach(function(q){q.drag=false});drag=null;
  if(nearEnd(p)){g.forEach(function(q){q.att=true;stack.push(q)})}}
 if(sd){var i=sd.i;sd=null;if(nearMount(p)){if(st.cur>=0)release();pick(i)}}}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
$('mDown').onclick=function(){st.down=true};
$('mUp').onclick=function(){st.down=false};
$('clear').onclick=release;
newSpring();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
